name: Paper research contracts
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package & tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Check Python syntax
        run: python -m compileall -q resnet_ablation scripts tests
      - name: Run architecture and protocol tests without downloading datasets
        run: python -m pytest -q tests/test_paper_research.py tests/test_paper_e2e.py tests/test_docs_links.py
      - name: Validate matrix can expand safely
        run: python -m resnet_ablation.research.sweep --manifest configs/paper/cifar10_depth_matrix.yaml
